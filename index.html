<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR code com link para 6 gigante</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:24px; display:grid; gap:24px; place-items:center; background:#f7f7f7; }
    .card { background:white; padding:20px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.1); }
    .label { font-size:14px; color:#555; margin-bottom:8px; text-align:center; }
    .big-six { font-size:30vh; font-weight:900; margin:0; }
  </style>
</head>
<body>
  <!-- Mostra o número 6 gigante -->
  <h1 class="big-six">6</h1>

  <!-- QR code apontando para o link -->
  <div class="card">
    <div class="label">Escaneie para abrir o link com “6” gigante</div>
    <div id="qrcode"></div>
  </div>

  <!-- Biblioteca QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // Aqui você coloca o link da página 6.html
    const link = "https://SEUUSUARIO.github.io/6.html";

    new QRCode(document.getElementById("qrcode"), {
      text: link,
      width: 240,
      height: 240
    });
  </script>
</body>
</html>
